[project]
name = "blackhole-harness"
version = "0.1.0"
description = "Shrink large open-weight models into ones that run on your own PC, from a TUI on a GPU VM."
requires-python = ">=3.11"
license = "Apache-2.0"
# The core (schemas, runner, marketplace, TUI) has no GPU dependencies, so `pipx install
# blackhole-harness` works on a laptop for browsing, drafting and validating schemas.
dependencies = ["textual>=1.0", "huggingface_hub>=0.30", "httpx>=0.27"]

[project.optional-dependencies]
# On the GPU VM. torch first, from the index `blackhole hw` names (cu128 on Blackwell).
gpu = ["torch>=2.7", "transformers>=4.56", "accelerate>=1.0", "safetensors>=0.4", "datasets>=3.0", "peft>=0.13"]
vllm = ["vllm"]                       # fast teacher and eval; often best in its own venv (BLACKHOLE_VLLM_PY)
frontier = ["anthropic>=0.40", "openai>=1.50"]
mlx = ["mlx-lm"]
dev = ["pytest>=8"]

[project.scripts]
blackhole = "blackhole.cli:main"
bh = "blackhole.cli:main"

# Third-party op packages register here, e.g.
# [project.entry-points."blackhole.ops"]
# myops = "myops.ops"

[tool.setuptools.packages.find]
include = ["blackhole*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
